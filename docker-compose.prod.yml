services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - app_public:/var/www/html/public:ro
      # Needed so nginx can follow the public/storage symlink (points into
      # /var/www/html/storage/app/public). Without this mount, uploaded songs,
      # artwork, and covers served via /storage/... return 404.
      - app_storage:/var/www/html/storage:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [web, app_internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Certbot renewal loop. First-time issuance runs from deployment/scripts/certbot-init.sh.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: malawiadventistmusic/app:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ROLE: app
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks: [app_internal]

  queue:
    image: malawiadventistmusic/app:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      APP_ROLE: queue
      SKIP_MIGRATIONS: "1"
    volumes:
      - app_storage:/var/www/html/storage
    networks: [app_internal]

  scheduler:
    image: malawiadventistmusic/app:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      APP_ROLE: scheduler
      SKIP_MIGRATIONS: "1"
    volumes:
      - app_storage:/var/www/html/storage
    networks: [app_internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [app_internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [app_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

networks:
  web:
    driver: bridge
  app_internal:
    driver: bridge
    internal: false  # keep false so containers can reach the internet for PayChangu, Mail, etc.

volumes:
  app_storage:
  app_public:
  mysql_data:
  redis_data:
  certbot_certs:
  certbot_www:
