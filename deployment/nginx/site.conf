# HTTP → HTTPS redirect. Also serves ACME challenges for Let's Encrypt renewals.
server {
    listen 80;
    listen [::]:80;
    server_name malawiadventistmusic.com www.malawiadventistmusic.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name malawiadventistmusic.com www.malawiadventistmusic.com;

    ssl_certificate     /etc/letsencrypt/live/malawiadventistmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malawiadventistmusic.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Redirect the apex → www or vice versa. We keep apex as canonical here.
    if ($host = www.malawiadventistmusic.com) {
        return 301 https://malawiadventistmusic.com$request_uri;
    }

    root /var/www/html/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static-asset caching for Vite build output and other hashed assets
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media (public disk symlink)
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon / robots — no logging
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Main Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
    }

    # Never serve dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
