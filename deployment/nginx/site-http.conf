# Bootstrap HTTP-only config. Used ONLY for the first-deploy window before
# Let's Encrypt has issued a certificate. After certbot succeeds, swap in
# site.conf (full HTTP+HTTPS) and reload nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name malawiadventistmusic.com www.malawiadventistmusic.com _;

    # Serve ACME HTTP-01 challenges for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Also serve the app so we can smoke-test before HTTPS is up
    root /var/www/html/public;
    index index.php;

    client_max_body_size 60M;

    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
