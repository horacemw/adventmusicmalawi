; php-fpm pool tuned for CX22 (2 vCPU / 4 GB). Adjust up when scaling.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Send FPM logs to stderr so `docker logs` shows them.
; (error_log is a global directive, set in php.ini; only access.log is pool-level.)
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Listen on all interfaces inside the container network.
listen = 0.0.0.0:9000
